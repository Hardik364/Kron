# mold linker is Linux-only — not applied globally to avoid breaking Windows builds.
# Install on Ubuntu/Debian: sudo apt install mold

# On Windows with the GNU toolchain, getrandom v0.3+ needs dlltool to generate
# Windows DLL import libraries. Rustup ships dlltool in the self-contained bin dir
# but does not add it to PATH. Setting DLLTOOL makes rustc and cc-rs find it.
[env]
DLLTOOL = "C:/tools/msys64/mingw64/bin/dlltool.exe"
CC = "C:/tools/msys64/mingw64/bin/gcc.exe"
CXX = "C:/tools/msys64/mingw64/bin/g++.exe"
AR = "C:/tools/msys64/mingw64/bin/ar.exe"
# GCC 15 removed implicit inclusion of <cstdint> types; bundled DuckDB 0.10
# source relies on uint8_t etc. being available without explicit #include.
# -include cstdint injects it globally. Remove when duckdb is upgraded.
# TODO(#1, hardik, v1.1): Remove CXXFLAGS hack when duckdb is upgraded
CXXFLAGS = "-include cstdint"

# MSVC target: use lld-link (copied from rustup's rust-lld.exe) instead of
# Git Bash's link.exe which uses GNU syntax and fails with MSVC-style args.
[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# eBPF target used when building kron-agent eBPF programs
[target.bpfel-unknown-none]
rustflags = ["-C", "relocation-model=pic"]
