name: Mobile CI

on:
  push:
    branches: [qa, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [qa, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  # ── Shared analysis (fast, no emulator needed) ─────────────────────────────
  analyze:
    name: Dart Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Format check
        run: dart format --output none --set-exit-if-changed .

  # ── Unit + widget tests ────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: mobile/coverage/lcov.info
          flags: flutter
        continue-on-error: true

  # ── Android APK build ──────────────────────────────────────────────────────
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [analyze, test]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: stable
          cache: true
      - run: flutter pub get

      # Decode release keystore from GitHub secret (base64-encoded JKS)
      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK (debug)
        if: github.ref != 'refs/heads/main'
        run: |
          flutter build apk --debug \
            --dart-define=KRON_API_URL=https://demo.kron.security/api/v1

      - name: Build APK (release)
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build apk --release \
            --dart-define=KRON_API_URL=https://app.kron.security/api/v1
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Build App Bundle (release)
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build appbundle --release \
            --dart-define=KRON_API_URL=https://app.kron.security/api/v1
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kron-android-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # ── iOS build (macOS runner) ───────────────────────────────────────────────
  build-ios:
    name: iOS Build
    runs-on: macos-14
    needs: [analyze, test]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - run: flutter pub get

      - name: Install iOS pods
        run: |
          cd ios
          pod install --repo-update

      # Import signing certificate + provisioning profile from secrets
      - name: Import code signing certificate
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Download provisioning profile
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: security.kron.app
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Build iOS (no-codesign, PR/qa)
        if: github.ref != 'refs/heads/main'
        run: |
          flutter build ios --no-codesign --debug \
            --dart-define=KRON_API_URL=https://demo.kron.security/api/v1

      - name: Build iOS IPA (release)
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build ipa --release \
            --dart-define=KRON_API_URL=https://app.kron.security/api/v1 \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kron-ios-${{ github.sha }}
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 30

  # ── Upload to stores (main branch only) ───────────────────────────────────
  deploy-android:
    name: Deploy to Play Store (Internal)
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kron-android-${{ github.sha }}
          path: artifacts/
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: security.kron.app
          releaseFiles: artifacts/**/*.aab
          track: internal
          status: completed

  deploy-ios:
    name: Deploy to TestFlight
    runs-on: macos-14
    needs: build-ios
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kron-ios-${{ github.sha }}
          path: artifacts/
      - uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: artifacts/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
