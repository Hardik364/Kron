name: QA

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kron

jobs:
  # Re-run all CI quality gates before building QA images
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  # Build and push Docker images tagged qa-{sha} and qa-latest
  build-images:
    name: Build QA Images (${{ matrix.service }})
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - kron-collector
          - kron-normalizer
          - kron-stream
          - kron-alert
          - kron-auth
          - kron-query-api
          - kron-soar
          - kron-compliance
          - kron-ai
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=qa-,format=short
            type=raw,value=qa-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary job — used for branch protection status checks
  qa-complete:
    name: QA Complete
    needs: [quality-gate, build-images]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.quality-gate.result }}" != "success" || "${{ needs.build-images.result }}" != "success" ]]; then
            echo "One or more QA jobs failed"
            exit 1
          fi
          echo "All QA jobs passed"
