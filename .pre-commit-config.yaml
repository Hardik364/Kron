repos:
  # Local hooks — run Rust tooling directly
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Enforce rustfmt formatting (see rustfmt.toml)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy with workspace lint rules (unwrap_used=deny etc.)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # Secret scanning — prevents committing credentials, tokens, API keys
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
