[workspace]
resolver = "2"
members = [
    "crates/kron-types",
    "crates/kron-storage",
    "crates/kron-bus",
    "crates/kron-agent",
    "crates/kron-collector",
    "crates/kron-normalizer",
    "crates/kron-stream",
    "crates/kron-ai",
    "crates/kron-alert",
    "crates/kron-auth",
    "crates/kron-soar",
    "crates/kron-compliance",
    "crates/kron-query-api",
    "crates/kron-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Hardik <hardik@kron.security>"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
tonic = { version = "0.11", features = ["tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1" # only in binaries (main.rs), not libraries

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Database
clickhouse = { version = "0.11", features = ["tls"] }
duckdb = { version = "0.10", features = ["bundled"] }

# Message bus
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }

# eBPF
aya = { version = "0.12" }
aya-log = "0.2"

# Cryptography
argon2 = "0.5"
jsonwebtoken = "9"
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
aes-gcm = "0.10"

# AI/ML
ort = { version = "1.18", features = ["load-dynamic"] }
ndarray = "0.15"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde_yaml = "0.9"
toml = "0.8"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
once_cell = "1"
dashmap = "5"

# Testing
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["clickhouse"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[workspace.lints.rust]
unsafe_code = "forbid" # no unsafe except kron-agent eBPF interop

[workspace.lints.clippy]
pedantic = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_docs = "warn"
missing_errors_doc = "warn"
