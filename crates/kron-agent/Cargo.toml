[package]
name = "kron-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "eBPF/ETW collection agent for KRON — deployed on monitored endpoints."

[[bin]]
name = "kron-agent"
path = "src/main.rs"

[dependencies]
kron-types = { path = "../kron-types" }
kron-bus = { path = "../kron-bus" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

# eBPF interop requires unsafe — scoped to the ebpf module only (ADR-005)
[lints.rust]
unsafe_code = "allow"
