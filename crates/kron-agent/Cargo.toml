[package]
name = "kron-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "eBPF/ETW collection agent for KRON — deployed on monitored endpoints."

[[bin]]
name = "kron-agent"
path = "src/main.rs"

[dependencies]
kron-types = { path = "../kron-types" }
kron-bus = { path = "../kron-bus" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# eBPF interop requires unsafe — scoped to the ebpf module only (ADR-005).
# Cannot inherit workspace lints and override, so we specify them explicitly here.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_docs = "warn"
missing_errors_doc = "warn"
