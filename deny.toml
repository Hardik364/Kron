[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]

[bans]
# These crates are banned — see DECISIONS.md for rationale
deny = [
    # No JVM-wrapper crates
    { name = "jni" },
    # No external AI API clients (ADR-014: zero external AI calls)
    { name = "async-openai" },
    { name = "openai" },
    # Use rustls, not openssl (ADR-008)
    { name = "openssl" },
    { name = "openssl-sys" },
    # No unmaintained crypto primitives
    { name = "md5" },
    { name = "sha1" }, # use sha2
]

[advisories]
# Deny any crate with an unpatched security advisory
deny = ["unmaintained", "unsound", "yanked"]
vulnerability = "deny"
