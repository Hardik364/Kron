  - Getting Started:
      - Quick Install: getting-started/quick-install.md
      - System Requirements: getting-started/requirements.md
      - Configuration: getting-started/configuration.md
      - First Login: getting-started/first-login.md
  - Architecture:
      - Overview: Architecture.md
      - Technology Stack: TechStack.md
      - Database Schema: Database.md
      - Security Design: Security.md
  - Features:
      - Feature Overview: Features.md
      - Alert Management: features/alerts.md
      - MITRE ATT&CK: features/mitre.md
      - SOAR Playbooks: features/soar.md
      - Compliance Reports: features/compliance.md
      - MSSP Portal: features/mssp.md
  - API Reference:
      - REST API: API.md
      - Authentication: api/authentication.md
      - Events: api/events.md
      - Alerts: api/alerts.md
      - Compliance: api/compliance.md
  - Deployment:
      - Production Deployment: Deployment.md
      - Helm Chart: deployment/helm.md
      - Docker Compose: deployment/compose.md
      - USB Installer: deployment/usb-installer.md
  - Operations:
      - Runbooks:
          - RB-001 Service Down: runbooks/RB-001-service-down.md
          - RB-002 ClickHouse Degraded: runbooks/RB-002-clickhouse-degraded.md
          - RB-003 Redpanda Lag: runbooks/RB-003-redpanda-lag.md
          - RB-004 Alert Delivery Failure: runbooks/RB-004-alert-delivery-failure.md
          - RB-005 Backup and Restore: runbooks/RB-005-backup-and-restore.md
          - RB-006 Security Incident: runbooks/RB-006-security-incident.md
      - Backup & Restore: operations/backup-restore.md
      - Monitoring: operations/monitoring.md
  - Security:
