site_name: KRON SIEM Documentation
site_description: Production-grade on-premise SIEM platform for the Indian market
site_author: kron.security
site_url: https://docs.kron.security
repo_url: https://github.com/Hardik364/Kron
repo_name: Hardik364/Kron
copyright: Copyright &copy; 2026 kron.security

docs_dir: docs
site_dir: site

# ── Theme ─────────────────────────────────────────────────────────────────────
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/kron-logo.png
  favicon: assets/favicon.png
  palette:
    # Dark mode (default — matches KRON dark UI)
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  font:
    text: Inter
    code: JetBrains Mono

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date

# ── Extensions ────────────────────────────────────────────────────────────────
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      title: On this page

# ── Extra ─────────────────────────────────────────────────────────────────────
extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hardik364/Kron
    - icon: fontawesome/solid/envelope
      link: mailto:support@kron.security
  analytics:
    provider: google
    property: G-KRON_GA_ID

extra_css:
  - stylesheets/extra.css

# ── Navigation ────────────────────────────────────────────────────────────────
